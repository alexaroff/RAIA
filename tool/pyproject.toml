[project]
name = "raia-tool"
version = "0.1.0"
description = "Fully local AI tool for recruiters (152-FZ compliant)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexandro" }]

dependencies = [
    "mlx>=0.22.0",
    "mlx-whisper>=0.4.3",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vad = [
    "silero-vad>=5.1",
    "torch",
    "torchaudio",
]
ui = [
    "gradio>=4.44.0",
]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
raia-transcribe = "tool.transcription.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcription", "diarization", "analysis", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
